name: Deployment manifest validation

on: [push, pull_request]

permissions:
  contents: read

jobs:
  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Render Kubernetes base
        run: kubectl kustomize deployment/kubernetes/base > /tmp/nexora-kubernetes.yaml
      - name: Validate Kubernetes base
        run: docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary < /tmp/nexora-kubernetes.yaml

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate 0.4.0 Compose configuration
        run: docker compose --env-file deployment/compose/images.env.example -f deployment/compose/compose.yaml -f deployment/compose/compose-0.4.0.yaml config --quiet
      - name: Validate tmpfs mount paths after YAML parsing
        run: >-
          docker compose --env-file deployment/compose/images.env.example -f deployment/compose/compose.yaml -f deployment/compose/compose-0.4.0.yaml config --format json |
          python3 -c 'import json,sys; services=json.load(sys.stdin)["services"]; mounts=[m for s in services.values() for m in s.get("tmpfs",[])]; assert mounts and all(isinstance(m,str) and m.startswith("/") for m in mounts), "Every tmpfs mount must retain its absolute path and options as one string"'
      - name: Validate the worker health contract for Compose wait
        run: >-
          docker compose --env-file deployment/compose/images.env.example -f deployment/compose/compose.yaml -f deployment/compose/compose-0.4.0.yaml config --format json |
          python3 -c 'import json,sys; h=json.load(sys.stdin)["services"]["worker"].get("healthcheck",{}); assert h.get("test") and not h.get("disable"), "The worker needs a healthcheck for compose up --wait"'
      - name: Validate image update script
        run: |
          bash -n deployment/compose/update.sh deployment/compose/tests/*.sh
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges -v "$PWD/deployment/compose:/mnt:ro" koalaman/shellcheck:v0.10.0 /mnt/update.sh /mnt/tests/update-recovery.sh /mnt/tests/worker-health.sh
      - name: Test deployment recovery without access to host services
        run: docker run --rm --network none -e NEXORA_RECOVERY_TEST=1 -v "$PWD/deployment/compose:/src:ro" ubuntu:24.04 bash /src/tests/update-recovery.sh
      - name: Test Compose wait with the worker process healthcheck
        run: bash deployment/compose/tests/worker-health.sh
