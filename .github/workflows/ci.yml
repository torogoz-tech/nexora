name: Documentation and Kubernetes

on: [push, pull_request]

permissions:
  contents: read

jobs:
  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Render Kubernetes base
        run: kubectl kustomize deployment/kubernetes/base > /tmp/nexora-kubernetes.yaml
      - name: Validate Kubernetes base
        run: docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary < /tmp/nexora-kubernetes.yaml

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate official-image Compose configuration
        run: docker compose -f deployment/compose/compose.yaml --env-file deployment/compose/images.env.example config --quiet
      - name: Validate image update script
        run: |
          bash -n deployment/compose/update.sh
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges -v "$PWD/deployment/compose:/mnt:ro" koalaman/shellcheck:v0.10.0 /mnt/update.sh
