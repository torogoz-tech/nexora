apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-mcp
  labels:
    app.kubernetes.io/name: nexora-mcp
    app.kubernetes.io/part-of: nexora
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexora-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexora-mcp
        app.kubernetes.io/part-of: nexora
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: nexora-mcp:0.4.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nexora-api-config
          ports:
            - name: http
              containerPort: 18081
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
