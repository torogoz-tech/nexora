apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-knowledge-worker
  labels:
    app.kubernetes.io/name: nexora-knowledge-worker
    app.kubernetes.io/part-of: nexora
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexora-knowledge-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexora-knowledge-worker
        app.kubernetes.io/part-of: nexora
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: nexora-knowledge-worker:0.4.0
          imagePullPolicy: IfNotPresent
          args: ["--connections", "/var/run/nexora/connections.json", "--schema", "nexora_platform", "--settings", "/etc/nexora/reasoning-settings.json"]
          env:
            - name: NEXORA_RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: nexora-runtime-secrets
                  key: rabbitmq-url
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: connections
              mountPath: /var/run/nexora
              readOnly: true
            - name: worker-config
              mountPath: /etc/nexora/reasoning-settings.json
              subPath: reasoning-settings.json
              readOnly: true
            - name: reasoning-key
              mountPath: /var/run/reasoning
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - name: connections
          secret:
            secretName: nexora-api-connections
        - name: worker-config
          configMap:
            name: nexora-worker-config
        - name: reasoning-key
          secret:
            secretName: nexora-runtime-secrets
            items:
              - key: openai-api-key
                path: openai-api-key
        - name: tmp
          emptyDir: {}

---

